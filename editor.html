<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор серий</title>
  <style>
    @font-face { font-family: 'Gros Ventre'; src: url('Gros-Ventre-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Gros Ventre', sans-serif; background: #0e0f11; color: #e8e8e8; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(14,15,17,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
    .topbar h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.04em; }
    .topbar-actions { display: flex; gap: 10px; }
    .btn { padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #e8e8e8; font-family: 'Gros Ventre', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.accent { background: #22C55E; color: #000; border-color: #22C55E; font-weight: 600; }
    .btn.accent:hover { background: #16a34a; }
    .btn.danger { border-color: #ef4444; color: #ef4444; }
    .btn.danger:hover { background: #ef4444; color: #fff; }

    .layout { display: flex; height: calc(100vh - 57px); }
    .sidebar { width: 260px; min-width: 260px; border-right: 1px solid rgba(255,255,255,0.08); overflow-y: auto; padding: 12px 0; }
    .sidebar-item { padding: 12px 20px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 12px; }
    .sidebar-item:hover { background: rgba(255,255,255,0.04); }
    .sidebar-item.active { background: rgba(34,197,94,0.1); border-left: 3px solid #22C55E; }
    .sidebar-item img { width: 40px; height: 50px; object-fit: cover; border-radius: 6px; }
    .sidebar-item-info { flex: 1; min-width: 0; }
    .sidebar-item-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-item-count { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .main { flex: 1; overflow-y: auto; padding: 24px; }
    .main-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: rgba(255,255,255,0.3); font-size: 16px; }
    .pack-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .pack-header h2 { font-size: 22px; font-weight: 400; }
    .pack-header .count { font-size: 13px; color: rgba(255,255,255,0.4); margin-left: 10px; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .photo-card { position: relative; border-radius: 10px; overflow: hidden; background: #1a1b1e; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
    .photo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .photo-card.dragging { opacity: 0.4; transform: scale(0.95); }
    .photo-card.drag-over { box-shadow: 0 0 0 2px #22C55E; }
    .photo-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
    .photo-card-actions { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px; opacity: 0; transition: opacity 0.2s; }
    .photo-card:hover .photo-card-actions { opacity: 1; }
    .photo-card-actions button { width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .photo-card-actions button:hover { background: rgba(255,255,255,0.2); }
    .photo-card-actions button.cover-btn.active { background: #22C55E; color: #000; }
    .photo-card .cover-badge { position: absolute; bottom: 8px; left: 8px; background: #22C55E; color: #000; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .photo-card .idx { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); color: rgba(255,255,255,0.7); font-size: 11px; padding: 2px 7px; border-radius: 8px; }

    .status { position: fixed; bottom: 20px; right: 20px; background: #22C55E; color: #000; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 100; }
    .status.show { opacity: 1; transform: translateY(0); }

    .loading { display: flex; align-items: center; justify-content: center; height: 100%; gap: 10px; }
    .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #22C55E; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .sidebar { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); max-height: 40vh; }
      .layout { flex-direction: column; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Редактор серий</h1>
    <div class="topbar-actions">
      <button class="btn" onclick="importConfig()">Импорт JSON</button>
      <button class="btn accent" onclick="exportConfig()">Экспорт JSON</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="loading"><div class="spinner"></div><span style="color:rgba(255,255,255,0.4)">Загрузка...</span></div>
    </div>
    <div class="main" id="main">
      <div class="main-empty">Выберите серию слева</div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const CONFIG = {
  driveFolderId: "1_zVX9cm_s9vXdny7Ipsc2rsigGwcXZIG",
  driveApiKey: "AIzaSyBz98xF6vEsgjpf53yTM8zuttlMJRxwbes"
};

let packs = [];
let selectedPack = -1;
let config = { packs: {} };

function img(id) { return `https://lh3.googleusercontent.com/d/${id}`; }

async function driveList(q) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&key=${CONFIG.driveApiKey}&fields=files(id,name,mimeType)&pageSize=100`);
  if (!r.ok) throw new Error(`API ${r.status}`);
  const d = await r.json();
  return d.files || [];
}

async function loadPacks() {
  try {
    const folders = await driveList(`'${CONFIG.driveFolderId}' in parents and mimeType='application/vnd.google-apps.folder'`);
    if (folders.length) {
      for (const f of folders) {
        if (f.name.startsWith("_")) continue;
        const files = await driveList(`'${f.id}' in parents and mimeType contains 'image/'`);
        if (!files.length) continue;
        packs.push({ name: f.name, folderId: f.id, files: files.map(x => ({ id: x.id, name: x.name })) });
      }
    } else {
      const files = await driveList(`'${CONFIG.driveFolderId}' in parents and mimeType contains 'image/'`);
      if (files.length) {
        packs.push({ name: "Портфолио", folderId: CONFIG.driveFolderId, files: files.map(x => ({ id: x.id, name: x.name })) });
      }
    }
    loadSavedConfig();
    renderSidebar();
  } catch(e) {
    document.getElementById("sidebar").innerHTML = `<div style="padding:20px;color:#ef4444">Ошибка: ${e.message}</div>`;
  }
}

function loadSavedConfig() {
  try { const s = localStorage.getItem("packs-config"); if (s) config = JSON.parse(s); } catch(e) {}
  packs.forEach(p => {
    if (!config.packs[p.name]) config.packs[p.name] = { coverId: null, photoOrder: [] };
    const pc = config.packs[p.name];
    if (!pc.photoOrder || !pc.photoOrder.length) {
      pc.photoOrder = p.files.map(f => f.id);
    }
    if (!pc.coverId) pc.coverId = p.files[0]?.id || null;
  });
}

function saveConfig() {
  localStorage.setItem("packs-config", JSON.stringify(config));
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  packs.forEach((p, i) => {
    const pc = config.packs[p.name];
    const coverId = pc?.coverId || p.files[0]?.id;
    const d = document.createElement("div");
    d.className = "sidebar-item" + (i === selectedPack ? " active" : "");
    d.onclick = () => selectPack(i);
    d.innerHTML = `
      <img src="${img(coverId)}" alt="">
      <div class="sidebar-item-info">
        <div class="sidebar-item-name">${p.name}</div>
        <div class="sidebar-item-count">${p.files.length} фото</div>
      </div>`;
    sb.appendChild(d);
  });
}

function selectPack(idx) {
  selectedPack = idx;
  renderSidebar();
  renderPack();
}

function getOrderedPhotos(p) {
  const pc = config.packs[p.name];
  if (!pc || !pc.photoOrder || !pc.photoOrder.length) return p.files.map(f => f.id);
  const idSet = new Set(p.files.map(f => f.id));
  const ordered = pc.photoOrder.filter(id => idSet.has(id));
  const rest = p.files.filter(f => !ordered.includes(f.id)).map(f => f.id);
  return [...ordered, ...rest];
}

function renderPack() {
  const p = packs[selectedPack];
  if (!p) return;
  const pc = config.packs[p.name];
  const ids = getOrderedPhotos(p);
  const idToFile = {};
  p.files.forEach(f => { idToFile[f.id] = f; });

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pack-header">
      <h2>${p.name} <span class="count">${ids.length} фото</span></h2>
      <div style="display:flex;gap:8px">
        <button class="btn danger" onclick="removePack(${selectedPack})">Удалить серию</button>
      </div>
    </div>
    <div class="photo-grid" id="photo-grid"></div>`;

  const grid = document.getElementById("photo-grid");
  ids.forEach((id, i) => {
    const f = idToFile[id];
    if (!f) return;
    const isCover = pc.coverId === id;
    const card = document.createElement("div");
    card.className = "photo-card";
    card.draggable = true;
    card.dataset.idx = i;
    card.dataset.id = id;
    card.innerHTML = `
      <img src="${img(id)}" alt="${f.name}" loading="lazy">
      <span class="idx">${i + 1}</span>
      ${isCover ? '<span class="cover-badge">Заглавное</span>' : ''}
      <div class="photo-card-actions">
        <button class="cover-btn ${isCover ? 'active' : ''}" onclick="setCover('${id}')" title="Заглавное фото">★</button>
        <button onclick="movePhoto(${i}, -1)" title="Вверх">↑</button>
        <button onclick="movePhoto(${i}, 1)" title="Вниз">↓</button>
        <button onclick="removePhoto('${id}')" title="Убрать из серии" style="color:#ef4444">×</button>
      </div>`;
    card.addEventListener("dragstart", onDragStart);
    card.addEventListener("dragover", onDragOver);
    card.addEventListener("dragleave", onDragLeave);
    card.addEventListener("drop", onDrop);
    card.addEventListener("dragend", onDragEnd);
    grid.appendChild(card);
  });
}

let dragIdx = null;
function onDragStart(e) { dragIdx = +e.currentTarget.dataset.idx; e.currentTarget.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
function onDragEnd(e) { e.currentTarget.classList.remove("dragging"); document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over")); }
function onDrop(e) {
  e.preventDefault();
  const toIdx = +e.currentTarget.dataset.idx;
  e.currentTarget.classList.remove("drag-over");
  if (dragIdx === null || dragIdx === toIdx) return;
  const p = packs[selectedPack];
  const pc = config.packs[p.name];
  const ids = getOrderedPhotos(p);
  const [moved] = ids.splice(dragIdx, 1);
  ids.splice(toIdx, 0, moved);
  pc.photoOrder = ids;
  saveConfig();
  renderPack();
  showStatus("Порядок сохранён");
  dragIdx = null;
}

function movePhoto(idx, dir) {
  const p = packs[selectedPack];
  const pc = config.packs[p.name];
  const ids = getOrderedPhotos(p);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= ids.length) return;
  [ids[idx], ids[newIdx]] = [ids[newIdx], ids[idx]];
  pc.photoOrder = ids;
  saveConfig();
  renderPack();
}

function setCover(id) {
  const p = packs[selectedPack];
  config.packs[p.name].coverId = id;
  saveConfig();
  renderPack();
  renderSidebar();
  showStatus("Заглавное фото изменено");
}

function removePhoto(id) {
  const p = packs[selectedPack];
  const pc = config.packs[p.name];
  pc.photoOrder = pc.photoOrder.filter(x => x !== id);
  if (pc.coverId === id) pc.coverId = pc.photoOrder[0] || null;
  saveConfig();
  renderPack();
  renderSidebar();
  showStatus("Фото убрано из серии");
}

function removePack(idx) {
  if (!confirm(`Удалить серию "${packs[idx].name}" из конфига?`)) return;
  const name = packs[idx].name;
  delete config.packs[name];
  saveConfig();
  showStatus("Серия удалена из конфига");
}

function exportConfig() {
  const clean = { packs: {} };
  Object.keys(config.packs).forEach(name => {
    const p = config.packs[name];
    clean.packs[name] = { coverId: p.coverId, photoOrder: p.photoOrder };
  });
  const blob = new Blob([JSON.stringify(clean, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "packs-config.json";
  a.click();
  URL.revokeObjectURL(a.href);
  showStatus("JSON скачан. Положите в корень сайта и закоммитьте.");
}

function importConfig() { document.getElementById("importInput").click(); }
function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      config = JSON.parse(reader.result);
      packs.forEach(p => {
        if (!config.packs[p.name]) config.packs[p.name] = { coverId: p.files[0]?.id || null, photoOrder: p.files.map(f => f.id) };
      });
      saveConfig();
      renderSidebar();
      if (selectedPack >= 0) renderPack();
      showStatus("JSON импортирован");
    } catch(e) { showStatus("Ошибка чтения JSON"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function showStatus(msg) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.classList.add("show");
  clearTimeout(s._t);
  s._t = setTimeout(() => s.classList.remove("show"), 2500);
}

loadPacks();
</script>
</body>
</html>

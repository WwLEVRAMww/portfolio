<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    @font-face { font-family: 'Gros Ventre'; src: url('../Gros-Ventre-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Gros Ventre', sans-serif; background: #0e0f11; color: #e8e8e8; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 24px; }
    .auth-screen h1 { font-size: 22px; font-weight: 400; letter-spacing: 0.04em; }
    .auth-screen p { font-size: 13px; color: rgba(255,255,255,0.4); max-width: 400px; text-align: center; line-height: 1.6; }
    .auth-screen .error { color: #ef4444; font-size: 13px; }
    #g_id_signin { border-radius: 12px; overflow: hidden; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(14,15,17,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
    .topbar h1 { font-size: 16px; font-weight: 400; letter-spacing: 0.04em; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .topbar-user { font-size: 12px; color: rgba(255,255,255,0.4); margin-right: 8px; }
    .btn { padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #e8e8e8; font-family: 'Gros Ventre', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.accent { background: #22C55E; color: #000; border-color: #22C55E; font-weight: 600; }
    .btn.accent:hover { background: #16a34a; }
    .btn.danger { border-color: #ef4444; color: #ef4444; }
    .btn.danger:hover { background: #ef4444; color: #fff; }
    .btn.sm { padding: 5px 12px; font-size: 11px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .layout { display: flex; height: calc(100vh - 53px); }
    .sidebar { width: 260px; min-width: 260px; border-right: 1px solid rgba(255,255,255,0.08); overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; }
    .sidebar-list { flex: 1; overflow-y: auto; }
    .sidebar-item { padding: 10px 16px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 10px; position: relative; }
    .sidebar-item:hover { background: rgba(255,255,255,0.04); }
    .sidebar-item.active { background: rgba(34,197,94,0.1); border-left: 3px solid #22C55E; }
    .sidebar-item.drag-over-item { border-top: 2px solid #22C55E; }
    .sidebar-item img { width: 36px; height: 46px; object-fit: cover; border-radius: 5px; flex-shrink: 0; }
    .sidebar-item-info { flex: 1; min-width: 0; }
    .sidebar-item-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-item-count { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; }
    .sidebar-item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
    .sidebar-item:hover .sidebar-item-actions { opacity: 1; }
    .sidebar-item-actions button { width: 24px; height: 24px; border-radius: 6px; border: none; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .sidebar-item-actions button:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .sidebar-item-actions button.del:hover { background: rgba(239,68,68,0.2); color: #ef4444; }
    .sidebar-add { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-add .btn { width: 100%; justify-content: center; display: flex; align-items: center; gap: 6px; }

    .name-edit { background: none; border: 1px solid rgba(34,197,94,0.4); border-radius: 6px; color: #e8e8e8; font-family: 'Gros Ventre', sans-serif; font-size: 13px; padding: 2px 6px; width: 100%; outline: none; }
    .name-edit:focus { border-color: #22C55E; }

    .main { flex: 1; overflow-y: auto; padding: 24px; }
    .main-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: rgba(255,255,255,0.3); font-size: 16px; }
    .pack-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
    .pack-header h2 { font-size: 22px; font-weight: 400; display: flex; align-items: center; gap: 10px; }
    .pack-header .count { font-size: 13px; color: rgba(255,255,255,0.4); }
    .pack-header-actions { display: flex; gap: 8px; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .photo-card { position: relative; border-radius: 10px; overflow: hidden; background: #1a1b1e; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
    .photo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .photo-card.dragging { opacity: 0.4; transform: scale(0.95); }
    .photo-card.drag-over { box-shadow: 0 0 0 2px #22C55E; }
    .photo-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
    .photo-card-actions { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px; opacity: 0; transition: opacity 0.2s; }
    .photo-card:hover .photo-card-actions { opacity: 1; }
    .photo-card-actions button { width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .photo-card-actions button:hover { background: rgba(255,255,255,0.2); }
    .photo-card-actions button.cover-btn.active { background: #22C55E; color: #000; }
    .photo-card .cover-badge { position: absolute; bottom: 8px; left: 8px; background: #22C55E; color: #000; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .photo-card .idx { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); color: rgba(255,255,255,0.7); font-size: 11px; padding: 2px 7px; border-radius: 8px; }

    .upload-zone { border: 2px dashed rgba(255,255,255,0.12); border-radius: 12px; padding: 40px; text-align: center; color: rgba(255,255,255,0.3); font-size: 14px; cursor: pointer; transition: all 0.2s; margin-top: 16px; }
    .upload-zone:hover { border-color: rgba(34,197,94,0.4); color: rgba(255,255,255,0.5); }
    .upload-zone.drag-active { border-color: #22C55E; background: rgba(34,197,94,0.05); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #1a1b1e; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 28px; width: 90%; max-width: 440px; }
    .modal h3 { font-size: 18px; font-weight: 400; margin-bottom: 20px; }
    .modal label { display: block; font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 6px; letter-spacing: 0.04em; }
    .modal input[type="text"], .modal input[type="file"] { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 14px; color: #e8e8e8; font-family: 'Gros Ventre', sans-serif; font-size: 14px; outline: none; margin-bottom: 16px; }
    .modal input[type="text"]:focus { border-color: #22C55E; }
    .modal input[type="file"] { cursor: pointer; padding: 8px; }
    .modal input[type="file"]::file-selector-button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #e8e8e8; font-family: 'Gros Ventre', sans-serif; font-size: 12px; padding: 6px 14px; cursor: pointer; margin-right: 10px; }
    .modal input[type="file"]::file-selector-button:hover { background: rgba(255,255,255,0.1); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
    .modal .progress { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 12px; min-height: 18px; }

    .confirm-text { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 20px; }

    .status { position: fixed; bottom: 20px; right: 20px; background: #22C55E; color: #000; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px); transition: all 0.3s; z-index: 200; pointer-events: none; }
    .status.show { opacity: 1; transform: translateY(0); }
    .status.error { background: #ef4444; color: #fff; }

    .loading { display: flex; align-items: center; justify-content: center; height: 100%; gap: 10px; }
    .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #22C55E; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .sidebar { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); max-height: 35vh; }
      .layout { flex-direction: column; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>

<div id="auth-screen" class="auth-screen" style="display:none">
  <h1>Редактор серий</h1>
  <p>Войдите через Google для доступа к редактору</p>
  <div id="g_id_signin"></div>
  <div class="error" id="auth-error"></div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <h1>Редактор серий</h1>
    <div class="topbar-actions">
      <span class="topbar-user" id="user-email"></span>
      <button class="btn" id="btn-reload" onclick="reloadData()">⟳ Загрузить</button>
      <button class="btn accent" id="btn-save" onclick="saveToGitHub()">Сохранить на сайте</button>
      <button class="btn" onclick="logout()">Выйти</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-list" id="sidebar">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <div class="sidebar-add">
        <button class="btn" onclick="showCreatePack()">+ Новая серия</button>
      </div>
    </div>
    <div class="main" id="main">
      <div class="main-empty">Выберите серию слева</div>
    </div>
  </div>
</div>

<div class="status" id="status"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const REPO_OWNER = "WwLEVRAMww";
const REPO_NAME = "portfolio";
const CONFIG_PATH = "packs-config.json";
const DRIVE_FOLDER_ID = "1_zVX9cm_s9vXdny7Ipsc2rsigGwcXZIG";
const DRIVE_API_KEY = "AIzaSyBz98xF6vEsgjpf53yTM8zuttlMJRxwbes";
const ALLOWED_EMAILS = ["levram13@gmail.com", "minipower240807@gmail.com"];

let googleClientId = "";
let githubToken = "";
let packs = [];
let selectedPack = -1;
let config = { packs: {} };
let configSha = null;
let userEmail = "";
let driveToken = null;

function img(id) { return `https://lh3.googleusercontent.com/d/${id}`; }

function showStatus(msg, isError) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status show" + (isError ? " error" : "");
  clearTimeout(s._t);
  s._t = setTimeout(() => s.className = "status", 3000);
}

// --- Setup ---
function loadSetup() {
  googleClientId = atob("NTk3NzEyMzM3MzUtczB2NWY2M2prdTFlY3JtNzNkdGpoZ3ZyYjRzYWZvbXQuYXBwcy5nb29nbGV1c2VyY29udGVudC5jb20=");
  githubToken = atob("Z2hwX0VXSktHRUp1WUVVUVN1SDVrd3d5c2VrM0d2ZldtWjBpeWpNUg==");
  return true;
}
function logout() {
  google.accounts.id.disableAutoSelect();
  location.reload();
}

// --- Google Auth ---
function initGoogleAuth() {
  if (typeof google === "undefined" || !google.accounts) {
    setTimeout(initGoogleAuth, 200);
    return;
  }
  google.accounts.id.initialize({
    client_id: googleClientId,
    callback: onGoogleLogin,
    auto_select: false
  });
  google.accounts.id.renderButton(
    document.getElementById("g_id_signin"),
    { theme: "filled_black", size: "large", shape: "pill", text: "signin_with", width: 280 }
  );
}

function onGoogleLogin(response) {
  const payload = JSON.parse(atob(response.credential.split(".")[1]));
  userEmail = payload.email;
  if (!ALLOWED_EMAILS.includes(userEmail)) {
    document.getElementById("auth-error").textContent = "Доступ запрещён: " + userEmail;
    return;
  }
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("user-email").textContent = userEmail;
  showDriveAuth();
}

function showDriveAuth() {
  document.getElementById("sidebar").innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  document.getElementById("main").innerHTML = `
    <div class="main-empty" style="flex-direction:column;gap:16px">
      <p>Нужно разрешить доступ к Google Диску для загрузки и управления фотографиями</p>
      <button class="btn accent" id="btn-drive-auth" onclick="requestDriveToken()">Разрешить доступ к Диску</button>
    </div>`;
}

function requestDriveToken() {
  const btn = document.getElementById("btn-drive-auth");
  if (btn) { btn.disabled = true; btn.textContent = "Откройте popup..."; }
  google.accounts.oauth2.initTokenClient({
    client_id: googleClientId,
    scope: "https://www.googleapis.com/auth/drive",
    callback: (tokenResponse) => {
      driveToken = tokenResponse.access_token;
      loadEditorData();
    },
    error_callback: (err) => {
      showStatus("Ошибка: " + (err.message || err.type), true);
      if (btn) { btn.disabled = false; btn.textContent = "Попробовать снова"; }
    }
  }).requestAccessToken();
}

// --- GitHub API ---
async function ghFetch(path, method, body) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const opts = { method, headers: { "Authorization": `token ${githubToken}`, "Accept": "application/vnd.github.v3+json" } };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
  return r.json();
}

async function loadConfig() {
  try {
    const d = await ghFetch(CONFIG_PATH, "GET");
    config = JSON.parse(atob(d.content));
    configSha = d.sha;
  } catch(e) {
    config = { packs: {} };
    configSha = null;
  }
}

async function saveConfig() {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(config, null, 2))));
  const body = { message: "Update packs config via editor", content };
  if (configSha) body.sha = configSha;
  const d = await ghFetch(CONFIG_PATH, "PUT", body);
  configSha = d.sha;
}

// --- Drive API ---
async function driveList(q) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&key=${DRIVE_API_KEY}&fields=files(id,name,mimeType)&pageSize=100`);
  if (!r.ok) throw new Error(`Drive API ${r.status}`);
  const d = await r.json();
  return d.files || [];
}

async function driveCreateFolder(name) {
  const metadata = { name, mimeType: "application/vnd.google-apps.folder", parents: [DRIVE_FOLDER_ID] };
  const r = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { "Authorization": `Bearer ${driveToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(metadata)
  });
  if (!r.ok) throw new Error(`Drive create folder ${r.status}: ${await r.text()}`);
  return r.json();
}

async function driveRenameFolder(fileId, name) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method: "PATCH",
    headers: { "Authorization": `Bearer ${driveToken}`, "Content-Type": "application/json" },
    body: JSON.stringify({ name })
  });
  if (!r.ok) throw new Error(`Drive rename ${r.status}: ${await r.text()}`);
  return r.json();
}

async function driveDeleteFile(fileId) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method: "DELETE",
    headers: { "Authorization": `Bearer ${driveToken}` }
  });
  if (!r.ok) throw new Error(`Drive delete ${r.status}: ${await r.text()}`);
}

async function driveUploadFile(folderId, file) {
  const metadata = { name: file.name, parents: [folderId] };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { "Authorization": `Bearer ${driveToken}` },
    body: form
  });
  if (!r.ok) throw new Error(`Drive upload ${r.status}: ${await r.text()}`);
  return r.json();
}

// --- Editor ---
async function loadEditorData() {
  try {
    await loadConfig();
    const folders = await driveList(`'${DRIVE_FOLDER_ID}' in parents and mimeType='application/vnd.google-apps.folder'`);
    packs = [];
    if (folders.length) {
      for (const f of folders) {
        if (f.name.startsWith("_")) continue;
        const files = await driveList(`'${f.id}' in parents and mimeType contains 'image/'`);
        if (!files.length) continue;
        packs.push({ name: f.name, folderId: f.id, files: files.map(x => ({ id: x.id, name: x.name })) });
      }
    } else {
      const files = await driveList(`'${DRIVE_FOLDER_ID}' in parents and mimeType contains 'image/'`);
      if (files.length) packs.push({ name: "Портфолио", folderId: DRIVE_FOLDER_ID, files: files.map(x => ({ id: x.id, name: x.name })) });
    }
    packs.forEach(p => {
      if (!config.packs[p.folderId]) config.packs[p.folderId] = { coverId: p.files[0]?.id || null, photoOrder: p.files.map(f => f.id) };
    });
    renderSidebar();
  } catch(e) {
    document.getElementById("sidebar").innerHTML = `<div style="padding:20px;color:#ef4444">Ошибка: ${e.message}</div>`;
  }
}

function reloadData() {
  document.getElementById("sidebar").innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  document.getElementById("main").innerHTML = '<div class="main-empty">Загрузка...</div>';
  selectedPack = -1;
  loadEditorData();
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  packs.forEach((p, i) => {
    const pc = config.packs[p.folderId];
    const coverId = pc?.coverId || p.files[0]?.id;
    const d = document.createElement("div");
    d.className = "sidebar-item" + (i === selectedPack ? " active" : "");
    d.dataset.idx = i;
    d.onclick = (e) => { if (e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") selectPack(i); };
    d.draggable = true;
    d.innerHTML = `
      <img src="${coverId ? img(coverId) : ''}" alt="">
      <div class="sidebar-item-info">
        <div class="sidebar-item-name" id="pack-name-${i}">${p.name}</div>
        <div class="sidebar-item-count">${p.files.length} фото</div>
      </div>
      <div class="sidebar-item-actions">
        <button onclick="startRenamePack(${i})" title="Переименовать">✎</button>
        <button class="del" onclick="confirmDeletePack(${i})" title="Удалить">✕</button>
      </div>`;
    d.addEventListener("dragstart", onPackDragStart);
    d.addEventListener("dragover", onPackDragOver);
    d.addEventListener("dragleave", onPackDragLeave);
    d.addEventListener("drop", onPackDrop);
    d.addEventListener("dragend", onPackDragEnd);
    sb.appendChild(d);
  });
}

function selectPack(idx) { selectedPack = idx; renderSidebar(); renderPack(); }

function getOrderedPhotos(p) {
  const pc = config.packs[p.folderId];
  if (!pc?.photoOrder?.length) return p.files.map(f => f.id);
  const idSet = new Set(p.files.map(f => f.id));
  const ordered = pc.photoOrder.filter(id => idSet.has(id));
  const rest = p.files.filter(f => !ordered.includes(f.id)).map(f => f.id);
  return [...ordered, ...rest];
}

function renderPack() {
  const p = packs[selectedPack];
  if (!p) return;
  const pc = config.packs[p.folderId];
  const ids = getOrderedPhotos(p);
  const idToFile = {};
  p.files.forEach(f => { idToFile[f.id] = f; });

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="pack-header">
      <h2><span id="pack-title">${p.name}</span> <span class="count">${ids.length} фото</span></h2>
      <div class="pack-header-actions">
        <button class="btn sm" onclick="startRenamePack(${selectedPack})">Переименовать</button>
        <button class="btn sm danger" onclick="confirmDeletePack(${selectedPack})">Удалить серию</button>
      </div>
    </div>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      Перетащите фото сюда или нажмите для выбора
      <input type="file" id="file-input" multiple accept="image/*" style="display:none" onchange="uploadPhotos(this.files)">
    </div>`;

  const grid = document.getElementById("photo-grid");
  ids.forEach((id, i) => {
    const f = idToFile[id];
    if (!f) return;
    const isCover = pc.coverId === id;
    const card = document.createElement("div");
    card.className = "photo-card";
    card.draggable = true;
    card.dataset.idx = i;
    card.dataset.id = id;
    card.innerHTML = `
      <img src="${img(id)}" alt="${f.name}" loading="lazy">
      <span class="idx">${i + 1}</span>
      ${isCover ? '<span class="cover-badge">Заглавное</span>' : ''}
      <div class="photo-card-actions">
        <button class="cover-btn ${isCover ? 'active' : ''}" onclick="setCover('${id}')" title="Заглавное">★</button>
        <button onclick="movePhoto(${i}, -1)" title="Вверх">↑</button>
        <button onclick="movePhoto(${i}, 1)" title="Вниз">↓</button>
        <button onclick="confirmDeletePhoto('${id}', ${i})" title="Удалить" style="color:#ef4444">✕</button>
      </div>`;
    card.addEventListener("dragstart", onDragStart);
    card.addEventListener("dragover", onDragOver);
    card.addEventListener("dragleave", onDragLeave);
    card.addEventListener("drop", onDrop);
    card.addEventListener("dragend", onDragEnd);
    grid.appendChild(card);
  });

  const uz = document.getElementById("upload-zone");
  uz.addEventListener("dragover", (e) => { e.preventDefault(); uz.classList.add("drag-active"); });
  uz.addEventListener("dragleave", () => uz.classList.remove("drag-active"));
  uz.addEventListener("drop", (e) => { e.preventDefault(); uz.classList.remove("drag-active"); uploadPhotos(e.dataTransfer.files); });
}

// --- Photo reorder ---
let dragIdx = null;
function onDragStart(e) { dragIdx = +e.currentTarget.dataset.idx; e.currentTarget.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("drag-over"); }
function onDragLeave(e) { e.currentTarget.classList.remove("drag-over"); }
function onDragEnd(e) { e.currentTarget.classList.remove("dragging"); document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over")); }
function onDrop(e) {
  e.preventDefault();
  const toIdx = +e.currentTarget.dataset.idx;
  e.currentTarget.classList.remove("drag-over");
  if (dragIdx === null || dragIdx === toIdx) return;
  const p = packs[selectedPack];
  const ids = getOrderedPhotos(p);
  const [moved] = ids.splice(dragIdx, 1);
  ids.splice(toIdx, 0, moved);
  config.packs[p.folderId].photoOrder = ids;
  renderPack();
  showStatus("Порядок изменён");
  dragIdx = null;
}

function movePhoto(idx, dir) {
  const p = packs[selectedPack];
  const ids = getOrderedPhotos(p);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= ids.length) return;
  [ids[idx], ids[newIdx]] = [ids[newIdx], ids[idx]];
  config.packs[p.folderId].photoOrder = ids;
  renderPack();
}

function setCover(id) {
  const p = packs[selectedPack];
  config.packs[p.folderId].coverId = id;
  renderPack();
  renderSidebar();
  showStatus("Заглавное фото изменено");
}

// --- Pack reorder ---
let packDragIdx = null;
function onPackDragStart(e) {
  packDragIdx = +e.currentTarget.dataset.idx;
  e.currentTarget.style.opacity = "0.4";
  e.dataTransfer.effectAllowed = "move";
}
function onPackDragOver(e) {
  e.preventDefault();
  document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("drag-over-item"));
  e.currentTarget.classList.add("drag-over-item");
}
function onPackDragLeave(e) { e.currentTarget.classList.remove("drag-over-item"); }
function onPackDragEnd(e) {
  e.currentTarget.style.opacity = "";
  document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("drag-over-item"));
}
function onPackDrop(e) {
  e.preventDefault();
  const toIdx = +e.currentTarget.dataset.idx;
  e.currentTarget.classList.remove("drag-over-item");
  if (packDragIdx === null || packDragIdx === toIdx) return;
  const [moved] = packs.splice(packDragIdx, 1);
  packs.splice(toIdx, 0, moved);
  if (selectedPack === packDragIdx) selectedPack = toIdx;
  else if (packDragIdx < selectedPack && toIdx >= selectedPack) selectedPack--;
  else if (packDragIdx > selectedPack && toIdx <= selectedPack) selectedPack++;
  renderSidebar();
  showStatus("Порядок серий изменён");
  packDragIdx = null;
}

// --- Rename pack ---
function startRenamePack(idx) {
  const nameEl = document.getElementById(`pack-name-${idx}`);
  if (!nameEl) return;
  const oldName = packs[idx].name;
  nameEl.innerHTML = `<input class="name-edit" type="text" value="${oldName}" data-idx="${idx}">`;
  const input = nameEl.querySelector("input");
  input.focus();
  input.select();
  input.onblur = () => renamePack(idx, input.value.trim() || oldName);
  input.onkeydown = (e) => { if (e.key === "Enter") input.blur(); if (e.key === "Escape") { input.value = oldName; input.blur(); } };
}

async function renamePack(idx, newName) {
  const p = packs[idx];
  if (newName === p.name) { renderSidebar(); return; }
  if (!driveToken) { showStatus("Нет доступа к Диску", true); renderSidebar(); return; }
  try {
    await driveRenameFolder(p.folderId, newName);
    packs[idx].name = newName;
    showStatus("Серия переименована");
    renderSidebar();
    if (selectedPack === idx) renderPack();
  } catch(e) {
    showStatus("Ошибка: " + e.message, true);
    renderSidebar();
  }
}

// --- Delete pack ---
function confirmDeletePack(idx) {
  const p = packs[idx];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>Удалить серию?</h3>
      <div class="confirm-text">«${p.name}» будет удалена с Google Диска без возможности восстановления. (${p.files.length} фото)</div>
      <div class="modal-actions">
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
        <button class="btn danger" id="confirm-del-btn">Удалить</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.getElementById("confirm-del-btn").onclick = () => { overlay.remove(); deletePack(idx); };
}

async function deletePack(idx) {
  const p = packs[idx];
  if (!driveToken) { showStatus("Нет доступа к Диску", true); return; }
  try {
    await driveDeleteFile(p.folderId);
    delete config.packs[p.folderId];
    packs.splice(idx, 1);
    if (selectedPack === idx) { selectedPack = -1; document.getElementById("main").innerHTML = '<div class="main-empty">Выберите серию слева</div>'; }
    else if (selectedPack > idx) selectedPack--;
    renderSidebar();
    showStatus("Серия удалена");
  } catch(e) {
    showStatus("Ошибка: " + e.message, true);
  }
}

// --- Create pack ---
function showCreatePack() {
  if (!driveToken) { showStatus("Нет доступа к Диску", true); return; }
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>Новая серия</h3>
      <label>Название</label>
      <input type="text" id="new-pack-name" placeholder="Название серии">
      <label>Фотографии</label>
      <input type="file" id="new-pack-files" multiple accept="image/*">
      <div class="progress" id="upload-progress"></div>
      <div class="modal-actions">
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
        <button class="btn accent" id="create-pack-btn">Создать</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.getElementById("create-pack-btn").onclick = () => createPack(overlay);
}

async function createPack(overlay) {
  const name = document.getElementById("new-pack-name").value.trim();
  const files = document.getElementById("new-pack-files").files;
  const progress = document.getElementById("upload-progress");
  const btn = document.getElementById("create-pack-btn");

  if (!name) { showStatus("Введите название", true); return; }
  if (!files.length) { showStatus("Выберите фотографии", true); return; }

  btn.disabled = true;
  btn.textContent = "Создание...";

  try {
    progress.textContent = "Создание папки...";
    const folder = await driveCreateFolder(name);

    const fileIds = [];
    for (let i = 0; i < files.length; i++) {
      progress.textContent = `Загрузка ${i + 1} из ${files.length}...`;
      const uploaded = await driveUploadFile(folder.id, files[i]);
      fileIds.push(uploaded.id);
    }

    packs.push({ name, folderId: folder.id, files: fileIds.map(id => ({ id, name: "" })) });
    config.packs[folder.id] = { coverId: fileIds[0] || null, photoOrder: fileIds };

    overlay.remove();
    selectedPack = packs.length - 1;
    renderSidebar();
    renderPack();
    showStatus(`Серия «${name}» создана (${files.length} фото)`);
  } catch(e) {
    showStatus("Ошибка: " + e.message, true);
    btn.disabled = false;
    btn.textContent = "Создать";
  }
}

// --- Upload photos to existing pack ---
async function uploadPhotos(fileList) {
  if (!fileList.length) return;
  const p = packs[selectedPack];
  if (!p) return;
  if (!driveToken) { showStatus("Нет доступа к Диску", true); return; }

  const zone = document.getElementById("upload-zone");
  const origText = zone.textContent;
  const fileIds = [];

  for (let i = 0; i < fileList.length; i++) {
    zone.textContent = `Загрузка ${i + 1} из ${fileList.length}...`;
    try {
      const uploaded = await driveUploadFile(p.folderId, fileList[i]);
      fileIds.push(uploaded.id);
      p.files.push({ id: uploaded.id, name: fileList[i].name });
    } catch(e) {
      showStatus("Ошибка загрузки: " + e.message, true);
    }
  }

  if (fileIds.length) {
    const pc = config.packs[p.folderId];
    if (!pc.photoOrder) pc.photoOrder = p.files.map(f => f.id);
    else pc.photoOrder = [...pc.photoOrder, ...fileIds];
    showStatus(`Загружено ${fileIds.length} фото`);
  }

  zone.textContent = "Перетащите фото сюда или нажмите для выбора";
  renderPack();
  renderSidebar();
}

// --- Delete photo from pack ---
function confirmDeletePhoto(id, idx) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>Удалить фото?</h3>
      <div class="confirm-text">Фото будет удалено с Google Диска без возможности восстановления.</div>
      <div class="modal-actions">
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
        <button class="btn danger" id="confirm-del-photo">Удалить</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.getElementById("confirm-del-photo").onclick = () => { overlay.remove(); deletePhoto(id, idx); };
}

async function deletePhoto(id, idx) {
  if (!driveToken) { showStatus("Нет доступа к Диску", true); return; }
  const p = packs[selectedPack];
  try {
    await driveDeleteFile(id);
    p.files = p.files.filter(f => f.id !== id);
    const pc = config.packs[p.folderId];
    if (pc.photoOrder) pc.photoOrder = pc.photoOrder.filter(pid => pid !== id);
    if (pc.coverId === id) pc.coverId = p.files[0]?.id || null;
    renderPack();
    renderSidebar();
    showStatus("Фото удалено");
  } catch(e) {
    showStatus("Ошибка: " + e.message, true);
  }
}

// --- Save ---
async function saveToGitHub() {
  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  btn.textContent = "Сохранение...";
  try {
    await saveConfig();
    showStatus("Сохранено! Сайт обновится через 1–2 минуты");
  } catch(e) {
    showStatus("Ошибка: " + e.message, true);
  }
  btn.disabled = false;
  btn.textContent = "Сохранить на сайте";
}

// --- Init ---
(function init() {
  loadSetup();
  document.getElementById("auth-screen").style.display = "flex";
  initGoogleAuth();
})();
</script>
